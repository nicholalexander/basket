name: Ruby

on: [push,pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.2.2'
          - '3.1.4'
          - '3.0.6'

    steps:
    - uses: actions/checkout@v3
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: false
    - name: Install dependencies
      run: |
        if [[ "${{ matrix.ruby }}" == "3.2.2" ]]; then
          bundle install
        else
          bundle install --without type_check
        fi
    - name: Run the default task
      run: bundle exec rake
    - name: Run type checks
      if: matrix.ruby == '3.2.2'
      run: |
        echo "=== Checking file content ==="
        head -25 lib/basket/backend_adapter/redis_backend.rb
        echo "=== Steep version ==="
        bundle exec ruby -e "require 'steep'; puts Steep::VERSION"
        echo "=== Running steep ==="
        bundle exec steep check
